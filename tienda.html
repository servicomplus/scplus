<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServiComp+ | Tienda</title>
<meta name="description" content="Catálogo premium de productos tecnológicos al mejor precio. Laptops, PCs, componentes y más.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Global primero, tienda después para sobrescribir -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tienda.css">
</head>
<body>

<!-- HEADER (inyectado) -->
<div id="header-placeholder"></div>

<div class="container">
  <h1 class="store-title">
    <span class="title-main">Catálogo</span>
    <span class="live-badge">
      <span class="live-dot"></span>
      En vivo
    </span>
  </h1>
  <p class="sub">Selecciona varias categorías, sedes o marcas a la vez · Ascendente por defecto</p>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    <div>Cargando catálogo...</div>
  </div>

  <div id="app" style="display:none">
    <div class="cmd">
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="Buscar producto, código, marca..." autocomplete="off">
      </div>
      <div class="filters">

        <div class="dropdown" data-dd="sede">
          <button type="button" class="dd-trigger" data-trigger>
            <i class="fa-solid fa-location-dot" style="color:var(--ink-soft);font-size:12px"></i>
            <span class="label">Todas las sedes</span>
            <span class="count-badge" style="display:none">0</span>
            <i class="fa-solid fa-chevron-down caret"></i>
          </button>
          <div class="dd-panel" data-panel>
            <div class="dd-search"><input type="text" placeholder="Buscar..." data-dd-search></div>
            <div class="dd-actions">
              <button type="button" data-dd-all>Seleccionar todo</button>
              <button type="button" data-dd-none>Limpiar</button>
            </div>
            <div class="dd-list" data-dd-list></div>
          </div>
        </div>

        <div class="dropdown" data-dd="cat">
          <button type="button" class="dd-trigger" data-trigger>
            <i class="fa-solid fa-tag" style="color:var(--ink-soft);font-size:12px"></i>
            <span class="label">Todas las categorías</span>
            <span class="count-badge" style="display:none">0</span>
            <i class="fa-solid fa-chevron-down caret"></i>
          </button>
          <div class="dd-panel" data-panel>
            <div class="dd-search"><input type="text" placeholder="Buscar categoría..." data-dd-search></div>
            <div class="dd-actions">
              <button type="button" data-dd-all>Seleccionar todo</button>
              <button type="button" data-dd-none>Limpiar</button>
            </div>
            <div class="dd-list" data-dd-list></div>
          </div>
        </div>

        <div class="dropdown" data-dd="marca">
          <button type="button" class="dd-trigger" data-trigger>
            <i class="fa-solid fa-copyright" style="color:var(--ink-soft);font-size:12px"></i>
            <span class="label">Todas las marcas</span>
            <span class="count-badge" style="display:none">0</span>
            <i class="fa-solid fa-chevron-down caret"></i>
          </button>
          <div class="dd-panel" data-panel>
            <div class="dd-search"><input type="text" placeholder="Buscar marca..." data-dd-search></div>
            <div class="dd-actions">
              <button type="button" data-dd-all>Seleccionar todo</button>
              <button type="button" data-dd-none>Limpiar</button>
            </div>
            <div class="dd-list" data-dd-list></div>
          </div>
        </div>

        <div class="dropdown" data-dd="orden">
          <button type="button" class="dd-trigger" data-trigger style="min-width:210px">
            <i class="fa-solid fa-arrow-up-1-9" style="color:var(--ink-soft);font-size:12px"></i>
            <span class="label">Precio: Menor a Mayor</span>
            <i class="fa-solid fa-chevron-down caret"></i>
          </button>
          <div class="dd-panel" data-panel style="min-width:240px">
            <div class="dd-list" data-dd-list-orden></div>
          </div>
        </div>

        <button type="button" class="btn-clear" id="btnClear">
          <i class="fa-solid fa-eraser"></i> Limpiar
        </button>
      </div>
    </div>

    <div class="results">
      <div class="count"><b id="count">0</b> productos disponibles <span id="excluidos" style="display:none;color:var(--ink-soft);font-size:11px"></span></div>
      <div class="meta">
        <span><i class="fa-regular fa-calendar"></i><span id="fecha">—</span></span>
        <span title="Tipo de cambio real aplicado">
          <i class="fa-regular fa-money-bill-1"></i>T.C. real <b id="tc">—</b>
        </span>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- CARRITO: OVERLAY + PANEL -->
<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-panel" id="cartPanel" aria-hidden="true">
  <div class="panel-header">
    <h2><i class="fa-solid fa-bag-shopping"></i> Mi Carrito</h2>
    <button class="close-btn" id="cartCloseBtn" aria-label="Cerrar carrito">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="panel-body" id="cartBody">
    <div class="empty-cart">
      <i class="fa-regular fa-cart-plus"></i>
      Agrega productos desde el catálogo
    </div>
  </div>

  <div class="panel-footer">
    <div class="field-group">
      <label for="clienteNombre">Tu nombre (opcional)</label>
      <input type="text" id="clienteNombre" placeholder="Nombre o empresa">
    </div>

    <div class="field-group">
      <label for="envioInput">Costo de envío (S/)</label>
      <input type="number" id="envioInput" value="19" min="0" step="0.5">
    </div>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span><span id="cartSubtotal">S/ 0.00</span>
      </div>
      <div class="summary-row">
        <span>Envío</span><span id="cartEnvio">S/ 0.00</span>
      </div>
      <div class="summary-row total">
        <span>TOTAL</span><span id="cartTotal">S/ 0.00</span>
      </div>
    </div>

    <div class="summary-actions">
      <button class="btn-wsp" id="btnWhatsApp">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </button>
      <button class="btn-pdf" id="btnPDF">
        <i class="fa-regular fa-file-pdf"></i> PDF
      </button>
      <button class="btn-print" id="btnPrint">
        <i class="fa-regular fa-print"></i> Imprimir
      </button>
      <button class="btn-vaciar" id="btnVaciar">
        <i class="fa-regular fa-trash-can"></i> Vaciar carrito
      </button>
    </div>
  </div>
</aside>

<!-- FAB CARRITO (IZQUIERDA) -->
<button class="fab-cart" id="fabCart" title="Ver carrito" aria-label="Ver carrito">
  <i class="fa-solid fa-bag-shopping"></i>
  <span class="badge hidden" id="cartBadge">0</span>
</button>

<!-- FOOTER (inyectado) -->
<div id="footer-placeholder"></div>

<!-- WHATSAPP GLOBAL (inyectado por global.js) -->
<div id="whatsapp-placeholder"></div>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fa-solid fa-check"></i>
  <span>Copiado</span>
</div>

<!-- PapaParse CDN -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- Loader global (inyecta header, footer, WhatsApp) -->
<script src="js/main.js"></script>

<!-- Script tienda -->
<script src="js/tienda.js?v=11"></script>

</body>
</html>
