<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiComp+ | Tienda - Catálogo Premium</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* ================================================================
           ESTILOS MEJORADOS DE TIENDA - Diseño Premium
           ================================================================ */

        /* ===== HEADER DE TIENDA ===== */
        .store-header {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-sm);
        }

        /* ===== PRODUCT GRID CARDS - MEJORADAS ===== */
        .product-grid-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            height: 100%;
        }

        .product-grid-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary);
        }

        .product-grid-card.featured {
            border-color: var(--accent);
            background: linear-gradient(180deg, var(--white) 0%, #fffbeb 100%);
        }

        /* ===== IMAGEN WRAPPER ===== */
        .product-grid-card .img-wrapper {
            background: var(--gray-50);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            padding: 16px;
            border-bottom: 1px solid var(--gray-100);
        }

        .product-grid-card .img-wrapper .placeholder-icon {
            position: absolute;
            z-index: 0;
            color: var(--gray-300);
            font-size: 2.5rem;
        }

        .product-grid-card .product-img {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
        }

        .product-grid-card .product-img.loaded { opacity: 1; }
        .product-grid-card:hover .product-img { transform: scale(1.05); }

        /* ===== VIEW LABEL ===== */
        .product-grid-card .view-label {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            color: var(--primary);
            font-size: 7px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 20;
            border: 1px solid var(--gray-200);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* ===== BADGES ===== */
        .badge-featured {
            background: #fef3c7;
            color: #b45309;
            font-weight: 700;
            font-size: 7px;
            letter-spacing: 0.06em;
            padding: 3px 12px;
            border-radius: 100px;
            border: 1px solid rgba(251,191,36,0.15);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 15;
        }

        .badge-brand {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
            font-size: 8px;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid rgba(26,58,92,0.06);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-mini {
            background: var(--gray-100);
            color: var(--gray-600);
            font-weight: 600;
            font-size: 8px;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid var(--gray-200);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .badge-mini:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .badge-specs {
            background: #e6f7ed;
            color: var(--secondary);
            font-weight: 600;
            font-size: 7px;
            letter-spacing: 0.04em;
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid rgba(16,185,129,0.12);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .badge-specs:hover {
            background: var(--secondary);
            color: var(--white);
            border-color: var(--secondary);
            transform: scale(1.02);
        }

        .badge-add {
            background: var(--primary);
            color: var(--white);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(26,58,92,0.15);
            margin-left: auto;
        }

        .badge-add:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(26,58,92,0.3);
            background: var(--primary-dark);
        }

        /* ===== BADGE ACTIONS ===== */
        .badge-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        /* ===== STOCK STATUS ===== */
        .stock-status {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 2px 10px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .stock-available {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid rgba(5,150,105,0.08);
        }

        .stock-low {
            background: #fef3c7;
            color: #d97706;
            border: 1px solid rgba(217,119,6,0.08);
        }

        .stock-critical {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid rgba(220,38,38,0.08);
        }

        /* ===== PRICE TAG ===== */
        .price-tag {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary);
        }

        .price-label {
            font-size: 9px;
            font-weight: 500;
            color: var(--gray-500);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ===== FAVORITE BUTTON ===== */
        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 15;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray-400);
            font-size: 12px;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
            background: var(--white);
            border-color: var(--danger);
        }

        .favorite-btn.active {
            color: var(--danger);
            background: #fde8ea;
            border-color: rgba(239,68,68,0.2);
        }

        /* ===== FEATURED SECTION TITLE ===== */
        .featured-section-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #b45309;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .featured-section-title .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(251,191,36,0.2), transparent);
        }

        /* ===== FILTROS ===== */
        .input-premium {
            background: var(--white);
            border: 2px solid var(--gray-200);
            color: var(--gray-900);
            transition: var(--transition);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 13px;
            width: 100%;
        }

        .input-premium:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.08);
        }

        .select-premium {
            background: var(--white);
            border: 2px solid var(--gray-200);
            color: var(--gray-900);
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364758b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.8rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            transition: var(--transition);
            border-radius: var(--radius);
            padding: 10px 36px 10px 14px;
            font-size: 12px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
        }

        .select-premium:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,58,92,0.08);
        }

        /* ===== PANEL CARRITO ===== */
        .panel-premium {
            background: var(--white);
            border-left: 1px solid var(--gray-200);
        }

        .panel-header-premium {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        .qt-row {
            border-bottom: 1px solid var(--gray-100);
            transition: background 0.2s ease;
        }

        .qt-row:hover {
            background: var(--gray-50);
        }

        /* ===== BOTÓN FLOTANTE CARRITO ===== */
        .float-cart {
            background: var(--primary);
            box-shadow: 0 8px 32px rgba(26,58,92,0.3);
            transition: var(--transition);
        }

        .float-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(26,58,92,0.4);
        }

        /* ===== COPY TOOLTIP ===== */
        .copy-tooltip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-900);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.4s ease, bottom 0.4s ease;
            pointer-events: none;
            z-index: 100;
            box-shadow: var(--shadow-xl);
        }

        .copy-tooltip.show { opacity: 1; bottom: 40px; }

        /* ===== LINE CLAMP ===== */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== LOAD MORE ===== */
        .load-more-trigger {
            text-align: center;
            padding: 24px;
            color: var(--gray-500);
            font-size: 12px;
        }

        /* ===== SCROLLBAR ===== */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 20px; }

        /* ================================================================ */
        /* RESPONSIVE - MEJORADO                                          */
        /* ================================================================ */

        /* Desktop: 4 columnas */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Tablet: 2 columnas */
        @media (max-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        /* Móvil: 1 columna */
        @media (max-width: 640px) {
            .products-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .product-grid-card {
                max-width: 400px;
                margin: 0 auto;
                width: 100%;
            }

            .store-header {
                padding: 16px;
            }

            .price-tag {
                font-size: 18px;
            }

            .badge-actions {
                gap: 4px;
            }

            .badge-brand,
            .badge-mini,
            .badge-specs {
                font-size: 7px;
                padding: 2px 8px;
            }

            .badge-add {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                gap: 12px;
            }

            .product-grid-card .img-wrapper {
                padding: 12px;
            }

            .product-grid-card .p-3 {
                padding: 12px;
            }

            .price-tag {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== COPY TOOLTIP ===== -->
    <div id="copyFeedback" class="copy-tooltip"><i class="fa-solid fa-check-circle mr-2"></i> Copiado</div>

    <!-- ===== HEADER GLOBAL ===== -->
    <div id="header-placeholder"></div>

    <!-- ================================================================ -->
    <!-- CONTENIDO PRINCIPAL - TIENDA                                    -->
    <!-- ================================================================ -->
    <main class="container mx-auto px-4 md:px-6 pt-24 pb-28">
        
        <!-- ===== HEADER DE TIENDA ===== -->
        <div class="store-header">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-white shadow-lg shadow-primary/20">
                        <i class="fa-solid fa-bag-shopping text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold text-gray-900 tracking-tight">
                            Catálogo <span class="text-primary">Premium</span>
                        </h1>
                        <p class="text-xs text-gray-500 font-medium">
                            <i class="fa-regular fa-circle-check text-green-500 mr-1"></i>
                            Inventario en tiempo real
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right">
                        <div id="resultCount" class="text-2xl font-extrabold text-gray-900 leading-none tracking-tight">0</div>
                        <div class="text-[8px] font-medium text-gray-400 tracking-[0.15em] uppercase">Productos</div>
                    </div>
                    <div class="h-10 w-px bg-gray-200"></div>
                    <div>
                        <div id="exchangeRate" class="text-xs font-semibold text-primary bg-primary-light px-3 py-1.5 rounded-full border border-primary/10">
                            TC: —
                        </div>
                        <div id="dateDisplay" class="text-[9px] text-gray-400 mt-0.5">
                            <i class="fa-regular fa-clock mr-1"></i> ...
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== FILTROS ===== -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5">
                <div>
                    <label class="text-[9px] font-bold text-gray-500 uppercase tracking-widest block mb-1">
                        <i class="fa-solid fa-tag mr-1"></i> Marca
                    </label>
                    <select id="brandSelect" class="select-premium">
                        <option value="">Todas las Marcas</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-gray-500 uppercase tracking-widest block mb-1">
                        <i class="fa-solid fa-location-dot mr-1"></i> Sede
                    </label>
                    <select id="sedeSelect" class="select-premium">
                        <option value="">Todas las Sedes</option>
                    </select>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-gray-500 uppercase tracking-widest block mb-1">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> Búsqueda
                    </label>
                    <input type="text" id="searchInput" class="input-premium" placeholder="Buscar productos..." />
                </div>
            </div>
        </div>

        <!-- ===== LISTA DE PRODUCTOS ===== -->
        <div id="productsList">
            <div class="flex flex-col items-center justify-center h-64 text-gray-300">
                <div class="w-8 h-8 border-2 border-primary border-t-transparent rounded-full animate-spin mb-3"></div>
                <p class="text-[10px] font-medium tracking-[0.2em] uppercase animate-pulse text-gray-400">Cargando Inventario...</p>
            </div>
        </div>
        <div id="loadMoreTrigger" class="load-more-trigger hidden">Cargando más productos...</div>
    </main>

    <!-- ================================================================ -->
    <!-- PANEL CARRITO LATERAL                                           -->
    <!-- ================================================================ -->
    <div id="quotationPanel" class="fixed inset-y-0 right-0 w-full md:w-[480px] panel-premium z-50 transform translate-x-full transition-transform duration-300 ease-out flex flex-col shadow-2xl">
        
        <!-- HEADER PANEL -->
        <div class="panel-header-premium p-4 flex justify-between items-center sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-bag-shopping text-white text-lg"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-gray-900 tracking-tight">Mi Carrito</h2>
                    <p class="text-[8px] text-gray-400 tracking-widest uppercase font-medium">Selección de productos</p>
                </div>
            </div>
            <button id="closePanelBtn" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 transition text-gray-500">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- CUERPO PANEL -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
            
            <!-- AGREGAR POR CÓDIGO -->
            <div class="rounded-xl p-3 bg-gradient-to-br from-blue-50/60 to-amber-50/60 border border-blue-100/30">
                <label class="text-[9px] font-bold uppercase text-gray-600 flex items-center gap-2 mb-1.5 tracking-[0.08em]">
                    <i class="fa-solid fa-keyboard text-primary"></i> Agregar por código
                </label>
                <div class="flex gap-2">
                    <input type="text" id="quickCodeInput" class="input-premium flex-1 rounded-xl px-3 py-2 text-xs font-mono" placeholder="Ej: MINI001, MINI003">
                    <button id="addQuickCodeBtn" class="btn btn-primary px-4 rounded-xl text-xs font-semibold"><i class="fa-solid fa-plus"></i></button>
                </div>
                <p class="text-[8px] text-gray-400 mt-1.5"><i class="fa-regular fa-circle-info mr-1"></i> Separa con comas o espacios</p>
            </div>

            <!-- LISTA DE PRODUCTOS -->
            <div>
                <div class="flex justify-between items-center mb-2 px-1">
                    <h3 class="font-bold text-gray-600 text-[10px] tracking-widest uppercase">
                        <i class="fa-solid fa-list mr-2 text-primary"></i> Productos
                    </h3>
                    <button id="clearQuotationBtn" class="text-[9px] text-gray-400 hover:text-danger transition font-medium">
                        <i class="fa-regular fa-trash-can mr-1"></i> Limpiar
                    </button>
                </div>
                <div id="quotationItemsContainer" class="rounded-xl border border-gray-200 bg-gray-50/50 min-h-[150px] max-h-[300px] overflow-y-auto custom-scroll">
                    <div class="p-6 text-center text-gray-400 text-xs font-light">🛒 Agrega productos desde el catálogo</div>
                </div>
            </div>

            <!-- RESUMEN -->
            <div class="rounded-xl p-3 bg-gray-50/50 border border-gray-200 space-y-2">
                <div class="flex justify-between text-xs py-0.5">
                    <span class="text-gray-500 font-light">Productos</span>
                    <span id="summaryDistinct" class="font-bold text-gray-900">0</span>
                </div>
                <div class="flex justify-between text-xs">
                    <span class="text-gray-500 font-light">Unidades</span>
                    <span id="summaryUnits" class="font-bold text-gray-900">0</span>
                </div>
                <div class="flex justify-between text-xs border-t border-gray-200 pt-2">
                    <span class="text-gray-500 font-light">Subtotal</span>
                    <span id="summarySubtotal" class="font-bold text-primary text-base">S/ 0</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-xs font-light flex items-center gap-2"><i class="fa-solid fa-truck"></i> Envío</span>
                    <div class="flex items-center gap-2 bg-white rounded-xl px-2 py-1.5 border border-gray-200">
                        <span class="text-gray-400 text-[10px]">S/</span>
                        <input type="number" id="shippingCost" value="19" step="5" class="w-20 text-right border-0 focus:ring-0 text-xs font-mono font-semibold text-gray-900 bg-transparent">
                    </div>
                </div>
                <div class="flex justify-between text-lg font-extrabold pt-2 border-t-2 border-gray-200">
                    <span class="text-gray-600">TOTAL</span>
                    <span id="summaryTotal" class="text-primary text-xl">S/ 0</span>
                </div>
            </div>
        </div>

        <!-- ACCIONES -->
        <div class="p-4 border-t border-gray-200 grid grid-cols-2 gap-2 bg-gray-50/50">
            <button id="genWhatsappBtn" class="btn btn-success py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp
            </button>
            <button id="genPDFBtn" class="btn btn-outline py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2">
                <i class="fa-regular fa-file-pdf"></i> PDF
            </button>
            <button id="printBtn" class="btn btn-secondary py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 col-span-2">
                <i class="fa-regular fa-print"></i> Imprimir
            </button>
        </div>
    </div>

    <!-- ================================================================ -->
    <!-- BOTÓN FLOTANTE CARRITO                                          -->
    <!-- ================================================================ -->
