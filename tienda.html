<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ServiComp+ | Tienda</title>
<meta name="description" content="Catálogo premium de productos tecnológicos al mejor precio. Laptops, PCs, componentes y más.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<!-- Global primero, tienda después para sobrescribir -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tienda.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- HEADER (inyectado) -->
<div id="header-placeholder"></div>

<!-- CONTENIDO TIENDA -->
<main class="store-main">

  <!-- Filtros -->
  <section class="store-filters-section">
    <div class="container">
      <div class="filters-bar">
        <div class="search-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Buscar producto, código, marca..." autocomplete="off">
        </div>
        <select id="sedeSelect"></select>
        <select id="catSelect"><option value="">Todas las categorías</option></select>
        <select id="marcaSelect"><option value="">Todas las marcas</option></select>
        <select id="ordenSelect">
          <option value="precio_asc">Precio ↑</option>
          <option value="precio_desc">Precio ↓</option>
          <option value="codigo_az">Código A-Z</option>
        </select>
      </div>

      <div class="results-bar">
        <div class="count-badge">
          <i class="fa-solid fa-layer-group"></i>
          <b id="resultsCount">0</b> productos disponibles
        </div>
        <div class="header-info">
          <div class="info-item">
            <i class="fa-regular fa-calendar"></i>
            <span id="fechaDisplay">—</span>
          </div>
          <div class="info-divider"></div>
          <div class="info-item">
            <i class="fa-regular fa-money-bill-1"></i>
            T.C. <b id="tcDisplay">—</b>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Productos -->
  <section class="products-section">
    <div class="container">
      <div id="productsList">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Cargando catálogo premium...</p>
        </div>
      </div>
      <div id="loadMoreTrigger" style="height:20px;"></div>
    </div>
  </section>

</main>

<!-- FOOTER (inyectado) -->
<div id="footer-placeholder"></div>

<!-- WHATSAPP (inyectado) -->
<div id="whatsapp-placeholder"></div>

<!-- OVERLAY CARRITO -->
<div class="cart-overlay" id="cartOverlay"></div>

<!-- PANEL CARRITO -->
<aside class="cart-panel" id="cartPanel" aria-hidden="true">
  <div class="panel-header">
    <h2><i class="fa-solid fa-bag-shopping"></i> Mi Carrito</h2>
    <button class="close-btn" id="cartCloseBtn" aria-label="Cerrar carrito">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="panel-body" id="cartBody">
    <div class="empty-cart">
      <i class="fa-regular fa-cart-plus"></i>
      Agrega productos desde el catálogo
    </div>
  </div>

  <div class="panel-footer">
    <div class="field-group">
      <label for="clienteNombre">Tu nombre (opcional)</label>
      <input type="text" id="clienteNombre" placeholder="Nombre o empresa">
    </div>

    <div class="field-group">
      <label for="envioInput">Costo de envío (S/)</label>
      <input type="number" id="envioInput" value="19" min="0" step="0.5">
    </div>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">S/ 0.00</span>
      </div>
      <div class="summary-row">
        <span>Envío</span>
        <span id="cartEnvio">S/ 0.00</span>
      </div>
      <div class="summary-row total">
        <span>TOTAL</span>
        <span id="cartTotal">S/ 0.00</span>
      </div>
    </div>

    <div class="summary-actions">
      <button class="btn-wsp" id="btnWhatsApp">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </button>
      <button class="btn-pdf" id="btnPDF">
        <i class="fa-regular fa-file-pdf"></i> PDF
      </button>
      <button class="btn-print" id="btnPrint">
        <i class="fa-regular fa-print"></i> Imprimir
      </button>
      <button class="btn-vaciar" id="btnVaciar">
        <i class="fa-regular fa-trash-can"></i> Vaciar carrito
      </button>
    </div>
  </div>
</aside>

<!-- FAB CARRITO (izquierda) -->
<button class="fab-cart" id="fabCart" title="Ver carrito" aria-label="Ver carrito">
  <i class="fa-solid fa-bag-shopping"></i>
  <span class="badge hidden" id="cartBadge">0</span>
</button>

<!-- TOAST -->
<div class="toast" id="toast">
  <i class="fa-solid fa-check"></i>
  <span>Copiado</span>
</div>

<script src="js/tienda.js"></script>

</body>
</html>
