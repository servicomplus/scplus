<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ServiComp+ | Consulta tu Cotización</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .documento {
    background: #ffffff;
    max-width: 900px;
    margin: 20px auto;
    padding: 30px 35px;
    border-radius: 8px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    border: 1px solid #e8eaed;
  }

  .header-doc {
    border-bottom: 3px solid #1a3a5c;
    padding-bottom: 15px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-doc .empresa { display: flex; align-items: center; gap: 12px; }
  .header-doc .empresa img { height: 50px; width: auto; }
  .header-doc .empresa h1 {
    font-size: 22px; font-weight: 800;
    color: #1a3a5c; letter-spacing: -0.5px; margin: 0;
  }
  .header-doc .empresa h1 span { color: #dc3545; }
  .header-doc .numero-cot { text-align: right; }
  .header-doc .numero-cot .label {
    font-size: 9px; color: #6c757d; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .header-doc .numero-cot .numero {
    font-size: 20px; font-weight: 800; color: #1a3a5c;
  }

  .info-cabecera {
    display: flex; justify-content: space-between;
    background: #f8f9fa; padding: 10px 15px;
    border-radius: 6px; margin-bottom: 18px;
    font-size: 12px; color: #495057;
    border: 1px solid #e9ecef;
    flex-wrap: wrap; gap: 8px;
  }
  .info-cabecera span i { margin-right: 6px; color: #1a3a5c; }
  .info-cabecera b { color: #1a3a5c; }

  .datos-cliente {
    display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
    margin-bottom: 20px; padding: 12px 15px;
    background: #f8f9fa; border-radius: 6px;
    border: 1px solid #e9ecef;
  }
  .datos-cliente .campo label {
    font-size: 10px; font-weight: 700; color: #6c757d;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: block; margin-bottom: 2px;
  }
  .datos-cliente .campo .valor {
    font-size: 14px; font-weight: 600; color: #1a1a1a;
    padding: 4px 0;
  }

  /* BADGE EN VIVO */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #d1fae5;
    color: #065f46;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    animation: pulse-dot 1.5s ease-in-out infinite;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* BUSCADOR */
  .buscador {
    background: #f8f9fa; border: 1px solid #e9ecef;
    border-radius: 6px; padding: 15px 20px;
    margin-bottom: 20px;
  }
  .buscador .titulo {
    font-size: 13px; font-weight: 700; color: #1a3a5c;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .buscador .titulo i { color: #10b981; }
  .buscador .input-group {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .buscador .input-group input {
    flex: 1; min-width: 200px;
    padding: 10px 12px;
    border: 1px solid #dee2e6; border-radius: 4px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    background: white;
    transition: border-color 0.2s;
  }
  .buscador .input-group input:focus {
    outline: none; border-color: #1a3a5c;
  }
  .buscador .input-group button {
    padding: 10px 24px; border: none; border-radius: 4px;
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; font-family: inherit;
  }
  .btn-buscar { background: #10b981; color: white; }
  .btn-buscar:hover { background: #059669; transform: translateY(-1px); }
  .btn-buscar:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
  .btn-limpiar { background: #6c757d; color: white; }
  .btn-limpiar:hover { background: #5a6268; transform: translateY(-1px); }
  .buscador .ayuda {
    font-size: 11px; color: #6c757d;
    margin-top: 8px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .buscador .ayuda i { color: #10b981; }
  .buscador .ayuda .ejemplo {
    background: #e9ecef; padding: 2px 10px;
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-size: 10px; color: #1a3a5c;
  }

  /* ESTADOS */
  .estado {
    text-align: center; padding: 50px 20px; color: #6c757d;
  }
  .estado i {
    font-size: 40px; margin-bottom: 12px;
    display: block; color: #cbd5e1;
  }
  .estado h3 { margin: 0 0 6px; color: #1a3a5c; font-size: 16px; }
  .estado p { font-size: 13px; margin: 0; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #e2e8f0; border-top-color: #1a3a5c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABLA */
  .tabla-productos { margin-bottom: 20px; }
  .tabla-productos table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .tabla-productos thead th {
    background: #f8f9fa; padding: 8px 10px;
    text-align: left; font-size: 10px; font-weight: 700;
    color: #495057; text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #dee2e6;
  }
  .tabla-productos thead th.num { text-align: right; }
  .tabla-productos thead th.centro { text-align: center; }
  .tabla-productos tbody td {
    padding: 10px; border-bottom: 1px solid #f1f3f5;
    vertical-align: middle;
  }
  .tabla-productos tbody td.num {
    text-align: right;
    font-family: 'Courier New', monospace;
    font-weight: 600; white-space: nowrap;
  }
  .tabla-productos tbody td.centro { text-align: center; font-weight: 700; }
  .tabla-productos tbody tr:hover { background: #f8f9fa; }
.producto-codigo {
  font-family: 'Courier New', monospace;
  font-weight: 700; font-size: 12px; color: #1a3a5c;
  text-transform: uppercase;
}
.producto-nombre {
  font-size: 11.5px;
  color: #495057;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 1.35;
  font-weight: 500;
}
.producto-marca {
  font-size: 9.5px;
  color: #6c757d;
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
  .producto-nombre { font-size: 12px; color: #495057; }
  .producto-marca { font-size: 10px; color: #6c757d; margin-top: 2px; }

  /* FOTO */
  .foto-cell { width: 54px; padding: 4px !important; }
  .foto-link {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 4px;
    overflow: hidden;
    transition: transform .15s, border-color .15s, box-shadow .15s;
    text-decoration: none;
    position: relative;
  }
  .foto-link:hover {
    transform: scale(1.08);
    border-color: #1a3a5c;
    box-shadow: 0 2px 8px rgba(26,58,92,0.15);
  }
  .foto-link img {
    width: 100%; height: 100%;
    object-fit: contain;
    padding: 3px;
  }
  .foto-cell.sin-foto .foto-link::before {
    content: '\f03e';
    font-family: 'Font Awesome 6 Free';
    font-weight: 400;
    color: #cbd5e1;
    font-size: 18px;
  }

  /* RESUMEN */
  .resumen {
    background: #f8f9fa; border: 1px solid #e9ecef;
    border-radius: 6px; padding: 15px 20px;
    margin-bottom: 20px;
  }
  .resumen .fila {
    display: flex; justify-content: space-between;
    padding: 4px 0; font-size: 13px;
  }
  .resumen .fila .label { color: #6c757d; }
  .resumen .fila .valor { font-weight: 600; color: #1a1a1a; }
  .resumen .fila.total {
    border-top: 2px solid #dee2e6;
    padding-top: 10px; margin-top: 6px;
  }
  .resumen .fila.total .label {
    font-size: 16px; font-weight: 800; color: #1a3a5c;
  }
  .resumen .fila.total .valor {
    font-size: 22px; font-weight: 800; color: #1a3a5c;
  }

  .acciones {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-top: 20px;
  }
  .acciones button {
    padding: 10px; border-radius: 6px; border: none;
    font-weight: 600; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; font-family: inherit;
  }
  .btn-wsp { background: #25D366; color: white; }
  .btn-wsp:hover { background: #1da851; transform: translateY(-1px); }
  .btn-pdf { background: #dc3545; color: white; }
  .btn-pdf:hover { background: #c82333; transform: translateY(-1px); }
  .btn-print { background: #6c757d; color: white; }
  .btn-print:hover { background: #5a6268; transform: translateY(-1px); }

  @media (max-width: 768px) {
    .documento { padding: 15px; margin: 10px; }
    .header-doc { flex-direction: column; align-items: flex-start; gap: 10px; }
    .header-doc .numero-cot { text-align: left; width: 100%; }
    .datos-cliente { grid-template-columns: 1fr; }
    .acciones { grid-template-columns: 1fr; }
    .buscador .input-group { flex-direction: column; }
    .buscador .input-group button { justify-content: center; }
    .resumen .fila.total .valor { font-size: 18px; }
    .tabla-productos { overflow-x: auto; }
    .tabla-productos table { min-width: 500px; font-size: 11px; }
    .tabla-productos thead th { font-size: 9px; padding: 6px; }
    .tabla-productos tbody td { padding: 6px; }
    .foto-cell { width: 40px; }
    .foto-link { width: 32px; height: 32px; }
  }

  @media print {
    body { background: white; }
    .documento { box-shadow: none; border: none; margin: 0; padding: 20px; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="documento" id="documento">

  <div class="header-doc">
    <div class="empresa">
      <img src="logo.png" alt="ServiComp+" onerror="this.style.display='none'">
      <div><h1>ServiComp<span>+</span></h1></div>
    </div>
    <div class="numero-cot">
      <div class="label">Cotización N°</div>
      <div class="numero" id="cotNumero">—</div>
    </div>
  </div>

  <div class="info-cabecera">
    <span><i class="fa-regular fa-calendar"></i> <span id="fechaDisplay">—</span></span>
    <span><i class="fa-regular fa-money-bill-1"></i> Tipo de cambio: <b id="tcDisplay">—</b></span>
  </div>

  <div class="datos-cliente">
    <div class="campo">
      <label><i class="fa-regular fa-user"></i> Cliente</label>
      <div class="valor" id="clienteNombre">—</div>
    </div>
    <div class="campo">
      <label><i class="fa-regular fa-id-card"></i> Estado</label>
      <div class="valor">
        <span class="live-badge">
          <span class="live-dot"></span> EN VIVO
        </span>
      </div>
    </div>
  </div>

  <div class="buscador no-print">
    <div class="titulo">
      <i class="fa-regular fa-circle-question"></i> ¿Tienes otro código de cotización? Ingrésalo aquí
    </div>
    <div class="input-group">
      <input type="text" id="codigoInput" placeholder="Ej: COT-A3F9B2C1" autocomplete="off">
      <button class="btn-buscar" id="btnBuscar" onclick="buscarCotizacion()">
        <i class="fa-solid fa-magnifying-glass"></i> BUSCAR
      </button>
      <button class="btn-limpiar" onclick="limpiarBusqueda()">
        <i class="fa-regular fa-trash-can"></i> LIMPIAR
      </button>
    </div>
    <div class="ayuda">
      <i class="fa-regular fa-lightbulb"></i>
      El código lo encuentras en el mensaje que te enviamos por WhatsApp
      <span class="ejemplo">Ej: COT-A3F9B2C1</span>
    </div>
  </div>

  <div id="contenido">
    <div class="estado">
      <div class="spinner"></div>
      <p>Cargando cotización...</p>
    </div>
  </div>

</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const URL_WEBAPP = 'https://script.google.com/macros/s/AKfycbxrIJEm1n5NGcqN4LiZjUu8wfWiU3hJXU2opBorjGYsI6WVebUjCfpz4ntrOLMZjiMA/exec';
const WHATSAPP_CONTACTO = '51973952322';
const ENVIO_DEFAULT = 19;

let COTIZACION_ACTUAL = null;
let PRODUCTOS_ACTUALES = [];
let TC_ACTUAL = 0;

// ============================================================
// HELPERS
// ============================================================
function fmt2(n) {
  if (n == null || isNaN(n)) return '0.00';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtFecha(f) {
  if (!f) return '—';
  const d = new Date(f);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('es-PE', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
  });
}
function getImagenDeltron(codigo) {
  const c = String(codigo || '').trim().toUpperCase();
  return 'https://www.deltron.com.pe/modulos/productos/items/image_ext.php?item=' +
         encodeURIComponent(c) + '&nomenu=1';
}

// ============================================================
// CARGAR TC REAL
// ============================================================
async function cargarTC() {
  try {
    const r = await fetch(URL_WEBAPP + '?accion=obtenerTC&t=' + Date.now());
    const data = await r.json();
    if (data.ok && data.tc > 0) {
      TC_ACTUAL = data.tc;
      document.getElementById('tcDisplay').textContent = 'S/ ' + TC_ACTUAL.toFixed(2);
    } else {
      document.getElementById('tcDisplay').textContent = '—';
    }
  } catch (e) {
    document.getElementById('tcDisplay').textContent = '—';
  }
}

// ============================================================
// CARGAR ÚLTIMA COTIZACIÓN
// ============================================================
async function cargarUltimaCotizacion() {
  try {
    const r = await fetch(URL_WEBAPP + '?accion=listarCotizaciones&t=' + Date.now());
    const data = await r.json();

    if (!data.ok || !data.cotizaciones || data.cotizaciones.length === 0) {
      mostrarVacio('Aún no hay cotizaciones', 'Cuando generes una desde el catálogo, aparecerá aquí automáticamente.');
      return;
    }

    const ordenadas = data.cotizaciones.slice().sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    const ultima = ordenadas[0];

    await cargarCotizacionPorId(ultima.id, true);
  } catch (e) {
    mostrarVacio('No se pudo cargar la última cotización', e.message);
  }
}

// ============================================================
// BUSCAR POR CÓDIGO
// ============================================================
async function buscarCotizacion() {
  const input = document.getElementById('codigoInput');
  const codigo = input.value.trim().toUpperCase();

  if (!codigo) {
    Swal.fire('Campo vacío', 'Ingresa tu código de cotización.', 'warning');
    return;
  }

  let idFinal = codigo;
  if (!codigo.startsWith('COT-') && /^[A-Z0-9]{6,12}$/.test(codigo)) {
    idFinal = 'COT-' + codigo;
  }

  await cargarCotizacionPorId(idFinal, false);
}

// ============================================================
// CARGA POR ID
// ============================================================
async function cargarCotizacionPorId(idFinal, esAutoCarga) {
  const btn = document.getElementById('btnBuscar');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> BUSCANDO...';

  document.getElementById('contenido').innerHTML = `
    <div class="estado">
      <div class="spinner"></div>
      <p>${esAutoCarga ? 'Cargando última cotización' : 'Buscando cotización'} <b>${esc(idFinal)}</b>...</p>
    </div>
  `;

  try {
    // 1) Cotización
    const rCot = await fetch(URL_WEBAPP + '?accion=obtenerCotizacion&id=' + encodeURIComponent(idFinal) + '&t=' + Date.now());
    const dCot = await rCot.json();
    if (!dCot.ok) throw new Error(dCot.error || 'Cotización no encontrada');

    const cot = dCot.cotizacion;
    if (!cot.codigos || cot.codigos.length === 0) throw new Error('Esta cotización no tiene productos.');

    // 2) Productos
    document.getElementById('contenido').innerHTML = `
      <div class="estado">
        <div class="spinner"></div>
        <p>Cargando productos...</p>
      </div>
    `;

    const rProd = await fetch(URL_WEBAPP + '?accion=obtenerProductos&codigos=' + encodeURIComponent(cot.codigos.join(',')) + '&t=' + Date.now());
    const dProd = await rProd.json();
    if (!dProd.ok) throw new Error(dProd.error || 'Error al cargar productos');

    const productos = dProd.productos || [];
    if (productos.length === 0) throw new Error('Los productos de esta cotización ya no están disponibles.');

    COTIZACION_ACTUAL = cot;
    PRODUCTOS_ACTUALES = productos;
    renderCotizacion(cot, productos);

    if (!esAutoCarga) {
      Swal.fire({
        title: '✓ Cotización cargada',
        text: productos.length + ' producto(s) encontrados.',
        icon: 'success',
        timer: 1500,
        showConfirmButton: false,
        toast: true,
        position: 'top-end'
      });
    }

  } catch (e) {
    document.getElementById('contenido').innerHTML = `
      <div class="estado">
        <i class="fa-solid fa-circle-exclamation" style="color:#ef4444"></i>
        <h3>No pudimos cargar la cotización</h3>
        <p>${esc(e.message)}</p>
      </div>
    `;
    if (!esAutoCarga) Swal.fire('Error', e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ============================================================
// RENDER
// ============================================================
function renderCotizacion(cot, productos) {
  const envio = ENVIO_DEFAULT;
  let subtotal = 0;

  const filas = productos.map(p => {
    const precio = Number(p.precio) || 0;
    subtotal += precio;
    const imgUrl = getImagenDeltron(p.codigo);
    return `
      <tr>
        <td class="foto-cell">
          <a href="${imgUrl}" target="_blank" rel="noopener noreferrer" class="foto-link" title="Ver foto">
            <img src="${imgUrl}" alt="${esc(p.codigo)}" loading="lazy"
                 onerror="this.parentElement.parentElement.classList.add('sin-foto'); this.remove();">
          </a>
        </td>
        <td><span class="producto-codigo">${esc(p.codigo)}</span></td>
        <td>
          <div class="producto-nombre">${esc(p.descripcion)}</div>
          ${p.marca ? `<div class="producto-marca">${esc(p.marca)}</div>` : ''}
        </td>
        <td class="num">S/ ${fmt2(precio)}</td>
        <td class="centro">1</td>
        <td class="num">S/ ${fmt2(precio)}</td>
      </tr>
    `;
  }).join('');

  const total = subtotal + envio;

  document.getElementById('cotNumero').textContent = cot.id;
  document.getElementById('fechaDisplay').textContent = fmtFecha(cot.fecha);
  document.getElementById('clienteNombre').textContent = cot.cliente || 'Cliente';

  document.getElementById('contenido').innerHTML = `
    <div class="tabla-productos">
      <table>
        <thead>
          <tr>
            <th style="width:54px;"></th>
            <th>Código</th>
            <th>Producto</th>
            <th class="num">Precio</th>
            <th class="centro">Cant.</th>
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody>
          ${filas}
        </tbody>
      </table>
    </div>

    <div class="resumen">
      <div class="fila">
        <span class="label">Subtotal</span>
        <span class="valor">S/ ${fmt2(subtotal)}</span>
      </div>
      <div class="fila">
        <span class="label"><i class="fa-solid fa-truck"></i> Envío</span>
        <span class="valor">S/ ${fmt2(envio)}</span>
      </div>
      <div class="fila total">
        <span class="label">TOTAL</span>
        <span class="valor">S/ ${fmt2(total)}</span>
      </div>
    </div>

    <div class="acciones no-print">
      <button class="btn-wsp" onclick="enviarWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> WhatsApp
      </button>
      <button class="btn-pdf" onclick="exportarPDF()">
        <i class="fa-regular fa-file-pdf"></i> PDF
      </button>
      <button class="btn-print" onclick="window.print()">
        <i class="fa-regular fa-print"></i> Imprimir
      </button>
    </div>
  `;

  document.title = 'Cotización ' + cot.id + ' - ServiComp+';
}

// ============================================================
// VACÍO
// ============================================================
function mostrarVacio(titulo, detalle) {
  document.getElementById('contenido').innerHTML = `
    <div class="estado">
      <i class="fa-solid fa-file-invoice"></i>
      <h3>${esc(titulo)}</h3>
      <p>${esc(detalle)}</p>
    </div>
  `;
}

// ============================================================
// WHATSAPP
// ============================================================
function enviarWhatsApp() {
  const cot = COTIZACION_ACTUAL;
  const productos = PRODUCTOS_ACTUALES;
  if (!cot || !productos.length) return;

  const envio = ENVIO_DEFAULT;
  let subtotal = 0;
  const lineas = productos.map(p => {
    const precio = Number(p.precio) || 0;
    subtotal += precio;
    return `• 1x ${p.descripcion} — S/ ${fmt2(precio)}`;
  }).join('\n');

  const total = subtotal + envio;

  const texto =
    `¡Hola ServiComp+! 👋\n\n` +
    `Acepto la cotización *${cot.id}*\n` +
    `Cliente: *${cot.cliente || 'Cliente'}*\n\n` +
    `*Productos:*\n${lineas}\n\n` +
    `*Subtotal:* S/ ${fmt2(subtotal)}\n` +
    `*Envío:* S/ ${fmt2(envio)}\n` +
    `*TOTAL:* S/ ${fmt2(total)}\n\n` +
    `Quedo atento para coordinar. ¡Gracias!`;

  window.open('https://wa.me/' + WHATSAPP_CONTACTO + '?text=' + encodeURIComponent(texto), '_blank');
}

// ============================================================
// PDF
// ============================================================
function exportarPDF() {
  const cot = COTIZACION_ACTUAL;
  if (!cot) return;

  const elemento = document.getElementById('documento');
  const fecha = new Date().toLocaleDateString('es-PE').replace(/\//g, '-');

  Swal.fire({
    title: 'Generando PDF...',
    text: 'Espera un momento',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  html2pdf()
    .set({
      margin: 0.4,
      filename: 'Cotizacion_' + cot.id + '_' + fecha + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    })
    .from(elemento)
    .save()
    .then(() => Swal.close())
    .catch((e) => {
      Swal.close();
      Swal.fire('Error', 'No se pudo generar el PDF: ' + e.message, 'error');
    });
}

// ============================================================
// LIMPIAR
// ============================================================
function limpiarBusqueda() {
  document.getElementById('codigoInput').value = '';
  mostrarVacio('Esperando código de cotización', 'Ingresa tu código arriba para ver los productos.');
  document.getElementById('cotNumero').textContent = '—';
  document.getElementById('fechaDisplay').textContent = '—';
  document.getElementById('clienteNombre').textContent = '—';
  document.title = 'ServiComp+ | Consulta tu Cotización';
  COTIZACION_ACTUAL = null;
  PRODUCTOS_ACTUALES = [];
}

// ============================================================
// INICIO
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('codigoInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      buscarCotizacion();
    }
  });

  // ✅ Cargar TC real y última cotización en paralelo
  cargarTC();
  cargarUltimaCotizacion();
});
</script>
