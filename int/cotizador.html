<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ServiComp+ | Consulta tu Cotización</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cotizador.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="documento" id="documento">

  <div class="header-doc">
    <div class="empresa">
      <img src="logo.png" alt="ServiComp+" onerror="this.style.display='none'">
      <div><h1>ServiComp<span>+</span></h1></div>
    </div>
    <div class="numero-cot">
      <div class="label">Cotización N°</div>
      <div class="numero" id="cotNumero">—</div>
    </div>
  </div>

  <div class="info-cabecera">
    <span><i class="fa-regular fa-calendar"></i> <span id="fechaDisplay">—</span></span>
    <span><i class="fa-solid fa-location-dot"></i> Sede de envío: <span id="sedeDisplay" class="sede-badge"><i class="fa-solid fa-spinner fa-spin"></i> Cargando</span></span>
    <span><i class="fa-regular fa-money-bill-1"></i> Tipo de cambio: <b id="tcDisplay">—</b></span>
  </div>

  <div class="datos-cliente">
    <div class="campo">
      <label><i class="fa-regular fa-user"></i> Cliente</label>
      <div class="valor" id="clienteNombre">—</div>
    </div>
    <div class="campo">
      <label><i class="fa-regular fa-id-card"></i> Estado</label>
      <div class="valor">
        <span class="live-badge">
          <span class="live-dot"></span> EN VIVO
        </span>
      </div>
    </div>
  </div>

  <div class="buscador no-print">
    <div class="titulo">
      <i class="fa-regular fa-circle-question"></i> ¿Tienes otro código de cotización? Ingrésalo aquí
    </div>
    <div class="input-group">
      <input type="text" id="codigoInput" placeholder="Ej: COT-A3F9B2C1" autocomplete="off">
      <button class="btn-buscar" id="btnBuscar" onclick="buscarCotizacion()">
        <i class="fa-solid fa-magnifying-glass"></i> BUSCAR
      </button>
      <button class="btn-limpiar" onclick="limpiarBusqueda()">
        <i class="fa-regular fa-trash-can"></i> LIMPIAR
      </button>
    </div>
    <div class="ayuda">
      <i class="fa-regular fa-lightbulb"></i>
      El código lo encuentras en el mensaje que te enviamos por WhatsApp
      <span class="ejemplo">Ej: COT-A3F9B2C1</span>
    </div>
  </div>

  <div id="contenido">
    <div class="estado">
      <div class="spinner"></div>
      <p>Cargando cotización...</p>
    </div>
  </div>

</div>

<script src="js/cotizador.js"></script>
</body>
</html>
