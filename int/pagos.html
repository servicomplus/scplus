<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Mis Cuentas - ServiComp Plus</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 18px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.light-mode {
            background-color: #f0f2f5;
            color: #1a1a1a;
        }

        body.dark-mode {
            background-color: #121212;
            color: #f0f0f0;
        }

        .main-card {
            width: 100%;
            max-width: 520px;
            border-radius: 1.5rem;
            padding: 1.5rem;
            position: relative;
            text-align: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        body.light-mode .main-card {
            background-color: #ffffff;
        }

        body.dark-mode .main-card {
            background-color: #1e1e1e;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.3s ease;
            flex-shrink: 0;
            background-color: #e9e7e2;
            padding: 12px;
        }

        body.dark-mode .avatar {
            background-color: #333;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .title {
            font-size: clamp(1.4rem, 4.5vw, 1.7rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            transition: color 0.3s ease;
            word-break: break-word;
        }

        body.light-mode .title {
            color: #111827;
        }

        body.dark-mode .title {
            color: #f3f4f6;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
            font-size: 1.2rem;
            z-index: 10;
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        body.light-mode .theme-toggle {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        body.light-mode .theme-toggle:hover {
            background-color: #e5e7eb;
            color: #374151;
        }

        body.dark-mode .theme-toggle {
            background-color: #333;
            color: #9ca3af;
        }

        body.dark-mode .theme-toggle:hover {
            background-color: #444;
            color: #e5e7eb;
        }

        .account-card {
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 0.75rem;
            gap: 0.75rem;
            min-height: 80px;
        }

        .account-card:last-child {
            margin-bottom: 0;
        }

        .account-card:active {
            transform: scale(0.98);
        }

        .account-card .clickable {
            cursor: pointer;
            transition: opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .account-card .clickable:active {
            opacity: 0.6;
        }

        .bank-logo {
            width: 52px;
            height: 52px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: white;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            padding: 6px;
        }

        .bank-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
        }

        .account-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .account-name {
            font-weight: 700;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-number {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            gap: 4px;
            word-break: break-all;
            white-space: normal;
            line-height: 1.4;
        }

        .account-number-cci {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 4px;
            word-break: break-all;
            white-space: normal;
            line-height: 1.4;
        }

        .qr-button {
            background: rgba(255, 255, 255, 0.2);
            transition: background 0.2s ease, transform 0.2s ease;
            flex-shrink: 0;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 0.9rem;
            border-radius: 0.75rem;
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
            min-height: 40px;
            min-width: 56px;
        }

        .qr-button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.35);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background-color: white;
            border-radius: 1.25rem;
            padding: 1.5rem;
            max-width: 380px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        body.dark-mode .modal-content {
            background-color: #1e1e1e;
            color: #f0f0f0;
        }

        .modal-logo {
            position: absolute;
            top: 1rem;
            left: 1.25rem;
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            color: white;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.08);
            padding: 4px;
        }

        .modal-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0.3rem;
        }

        .modal-close {
            margin-left: auto;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
            color: #9ca3af;
        }

        .modal-qr-container {
            background: #f9fafb;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        body.dark-mode .modal-qr-container {
            background: #2a2a2a;
        }

        .modal-qr-container img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            display: block;
        }

        .modal-titular {
            text-align: center;
            font-size: clamp(1.2rem, 3.2vw, 1.35rem);
            font-weight: 700;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            color: #111827;
        }

        body.dark-mode .modal-titular {
            border-top-color: rgba(255, 255, 255, 0.08);
            color: #f0f0f0;
        }

        .modal-close-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        body.dark-mode .modal-close-btn {
            background-color: #333;
            color: #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .notification {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            z-index: 100;
            font-weight: 500;
            font-size: 1rem;
            max-width: 90%;
            text-align: center;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: clamp(0.7rem, 1.8vw, 0.8rem);
            opacity: 0.5;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
            font-weight: 600;
        }

        .clickable {
            position: relative;
            cursor: pointer;
        }

        .clickable .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 0.25rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            white-space: nowrap;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .clickable:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="light-mode">

    <div class="main-card">
        <!-- Botón Modo Oscuro -->
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar modo oscuro">
            <i class="fa-regular fa-moon"></i>
        </button>

        <!-- Avatar con logo.png -->
        <div class="avatar">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.textContent='PE';">
        </div>

        <!-- Nombre de negocio -->
        <h1 class="title">ServiComp Plus</h1>

        <!-- Contenedor de Tarjetas -->
        <div id="cuentas-container" class="space-y-3"></div>

        <!-- Footer -->
        <div class="footer">
            Diseñado por 
            <a href="https://wa.me/51973952322?text=Hola%2C%20quiero%20uno%20igual%20por%20favor" target="_blank" rel="noopener noreferrer">
                ServiComp+
            </a>
        </div>
    </div>

    <!-- Archivo JS con los datos de las cuentas -->
    <script src="js/cuentas.js"></script>

    <script>
        let darkMode = false;
        const themeToggle = document.getElementById('themeToggle');
        const container = document.getElementById('cuentas-container');

        function toggleTheme() {
            darkMode = !darkMode;
            const body = document.body;
            const icon = themeToggle.querySelector('i');

            if (darkMode) {
                body.classList.remove('light-mode');
                body.classList.add('dark-mode');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark-mode');
                body.classList.add('light-mode');
                icon.className = 'fa-regular fa-moon';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                darkMode = true;
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                themeToggle.querySelector('i').className = 'fa-solid fa-sun';
            }
        }

        themeToggle.addEventListener('click', toggleTheme);

        function copiarTexto(texto, event) {
            if (event) event.stopPropagation();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(texto).then(() => {
                    mostrarNotificacion('¡Copiado al portapapeles!', 'success');
                }).catch(() => fallbackCopiar(texto));
            } else {
                fallbackCopiar(texto);
            }
        }

        function fallbackCopiar(texto) {
            const textarea = document.createElement('textarea');
            textarea.value = texto;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            mostrarNotificacion('¡Copiado al portapapeles!', 'success');
        }

        function mostrarQR(qrUrl, banco, titular, logo) {
            if (!qrUrl) {
                mostrarNotificacion('No hay imagen QR disponible', 'error');
                return;
            }

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            const logoHtml = logo ? `<img src="${logo}" alt="${banco}">` : banco.substring(0, 4).toUpperCase();

            modal.innerHTML = `
                <div class="modal-content">
                    <div class="flex items-center justify-between mb-4">
                        <div class="modal-logo">${logoHtml}</div>
                        <h3 class="text-xl font-bold ml-12">${banco}</h3>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                    </div>
                    <div class="modal-qr-container">
                        <img src="${qrUrl}" alt="Código QR de pago">
                    </div>
                    <div class="modal-titular">${titular}</div>
                    <button class="modal-close-btn" onclick="this.closest('.modal-overlay').remove()">Cerrar</button>
                </div>
            `;

            modal.addEventListener('click', function(e) {
                if (e.target === this) this.remove();
            });

            document.body.appendChild(modal);
        }

        function mostrarNotificacion(msg, tipo = 'info') {
            const colores = {
                success: darkMode ? '#059669' : '#10b981',
                info: darkMode ? '#2563eb' : '#3b82f6',
                error: darkMode ? '#dc2626' : '#ef4444'
            };

            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.backgroundColor = colores[tipo] || colores.info;
            notif.style.color = '#ffffff';
            notif.textContent = msg;

            document.body.appendChild(notif);

            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transition = 'opacity 0.3s ease';
                setTimeout(() => notif.remove(), 300);
            }, 2500);
        }

        function renderizarCuentas(cuentas) {
            if (!cuentas || cuentas.length === 0) {
                container.innerHTML = `<div class="p-4 text-center">No hay cuentas disponibles en este momento.</div>`;
                return;
            }

            let html = '';
            cuentas.forEach(c => {
                const banco = c.banco || 'Banco';
                const titular = c.titular || 'ServiComp Plus';
                const telefono = c.telefono || '';
                const cuenta = c.cuenta || '';
                const cci = c.cci || '';
                const colorFondo = c.color || '#1e40af';
                const logo = c.logo || '';
                const qr = c.qr || '';

                const logoMarkup = logo ? `<img src="${logo}" alt="${banco}">` : banco.substring(0, 4).toUpperCase();

                html += `
                    <div class="account-card" style="background-color: ${colorFondo};">
                        <div class="bank-logo">${logoMarkup}</div>
                        <div class="account-info">
                            <div class="account-name">${titular}</div>
                            ${telefono ? `
                                <div class="account-number clickable" onclick="copiarTexto('${telefono}', event)">
                                    <span>${telefono}</span>
                                    <span class="tooltip">Click para copiar</span>
                                </div>
                            ` : `
                                ${cuenta ? `
                                    <div class="account-number clickable" onclick="copiarTexto('${cuenta}', event)">
                                        <span>N°: ${cuenta}</span>
                                        <span class="tooltip">Click para copiar</span>
                                    </div>
                                ` : ''}
                                ${cci ? `
                                    <div class="account-number-cci clickable" onclick="copiarTexto('${cci}', event)">
                                        <span>CCI: ${cci}</span>
                                        <span class="tooltip">Click para copiar</span>
                                    </div>
                                ` : ''}
                            `}
                        </div>
                        ${qr ? `
                            <button class="qr-button" onclick="mostrarQR('${qr}', '${banco}', '${titular}', '${logo}')">
                                <i class="fa-solid fa-qrcode"></i> QR
                            </button>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        loadTheme();

        // Renderizado directo e instantáneo
        if (typeof MIS_CUENTAS !== 'undefined') {
            renderizarCuentas(MIS_CUENTAS);
        } else {
            console.error('No se encontró el archivo js/cuentas.js');
        }
    </script>
</body>
</html>
