<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicomplus — Cómo pagarme </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pagos.css">
</head>
<body>

<div class="wrap">

  
    <header class="profile">
    <button class="theme-toggle" aria-label="Cambiar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>

    <div class="avatar-frame">
      <!-- Fondo blanco aplicado directamente al contenedor interior -->
      <div class="avatar-inner" style="background: #ffffff;">
        <img src="https://servicomplus.com/img/logo.png" alt="Servicomp Plus" style="width: 100%; height: 100%; object-fit: contain; padding: 6px; position: relative; z-index: 2;">
      </div>
    </div>

    <!-- Texto Estilo Opción 2 -->
    <h1 class="profile-name" style="font-family: 'Inter', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; margin-top: 4px; background: none; -webkit-text-fill-color: var(--text-main);">
      Servicomp <span style="color: var(--gold-2); font-weight: 800;">Plus</span>
    </h1>
    
    <span class="profile-tag" style="border-radius: 999px; padding: 5px 16px; font-size: 0.65rem; letter-spacing: 0.15em; background: rgba(249, 226, 156, 0.08); border: none; color: var(--gold-1); font-weight: 600; text-transform: uppercase; margin-top: -4px;">
      Métodos de Pago
    </span>
  </header>


  <main class="methods" id="methods"></main>

  <footer class="footer">
    <p>Diseñado por</p>
    <a href="https://wa.me/51973952322?text=Quiero%20uno%20igual%20para%20mi%20por%20favor" target="_blank" rel="noopener">Servicomplus</a>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6 9 17l-5-5"/>
  </svg>
  <span id="toast-text">Copiado al portapapeles</span>
</div>

<div class="qr-overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="qr-panel" id="qrPanel">
    <button class="qr-close" id="qrClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <div class="qr-brand">
      <div class="qr-brand-icon" id="qrBrandIcon"></div>
      <span class="qr-brand-name" id="qrTitle">Yape</span>
    </div>
    <p class="qr-hint">Escanea el código con tu app</p>

    <div class="qr-frame">
      <span class="qr-corner tl"></span>
      <span class="qr-corner tr"></span>
      <span class="qr-corner bl"></span>
      <span class="qr-corner br"></span>
      <!-- El canvas o la imagen se inyectan aquí dinámicamente -->
    </div>

    <div class="qr-value-box">
      <span class="qv-text" id="qrValue">8465485</span>
      <button class="qv-copy" id="qrCopy" aria-label="Copiar número">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </svg>
      </button>
    </div>

    <p class="qr-holder">A nombre de <strong id="qrHolder">jhosnsn</strong></p>
    <p class="qr-note">También puedes copiar el dato y pagar manualmente</p>
  </div>
</div>

<script src="js/pagos.js"></script>
</body>
</html>
