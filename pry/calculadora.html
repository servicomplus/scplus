<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧮 Calculadora Financiera PRO - IGV 18%</title>
    <style>
        /* ============================================ */
        /* RESET Y BASE                                 */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        /* ============================================ */
        /* CONTENEDOR PRINCIPAL                         */
        /* ============================================ */
        .calculator-container {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 24px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease;
        }

        .calculator-container:hover {
            transform: translateY(-2px);
        }

        /* ============================================ */
        /* HEADER                                       */
        /* ============================================ */
        .calc-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2px;
        }

        .calc-header .icon {
            font-size: 26px;
        }

        .calc-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
        }

        .calc-header .badge {
            background: #dbeafe;
            color: #2563eb;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: auto;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .calc-header .badge-pro {
            background: #fef3c7;
            color: #d97706;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .calc-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
            padding-left: 38px;
        }

        /* ============================================ */
        /* GRID DE CAMPOS                               */
        /* ============================================ */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (min-width: 480px) {
            .calc-grid {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .calc-header h1 {
                font-size: 22px;
            }
        }

        .calc-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .calc-field label {
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .calc-field label .label-badge {
            font-size: 8px;
            background: #f1f5f9;
            color: #64748b;
            padding: 0 6px;
            border-radius: 6px;
            font-weight: 500;
            text-transform: none;
        }

        .calc-field.calc-total label {
            color: #0f172a;
        }

        .calc-field.calc-total label .label-badge {
            background: #dbeafe;
            color: #2563eb;
        }

        /* ============================================ */
        /* INPUT GROUP                                 */
        /* ============================================ */
        .calc-input-group {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            overflow: hidden;
            min-width: 0;
        }

        .calc-input-group:focus-within {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
        }

        .calc-field.calc-total .calc-input-group {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .calc-field.calc-total .calc-input-group:focus-within {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .calc-input-group .currency {
            padding: 0 0 0 12px;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            font-family: ui-monospace, monospace;
            user-select: none;
            flex-shrink: 0;
        }

        .calc-input-group input {
            flex: 1;
            border: none;
            padding: 10px 6px;
            font-size: 18px;
            font-weight: 600;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            background: transparent;
            outline: none;
            min-width: 0;
            width: 100%;
            color: #0f172a;
            letter-spacing: 0.3px;
            text-align: right;
            transition: font-size 0.2s ease;
        }

        .calc-input-group input.font-xl {
            font-size: 20px;
        }
        .calc-input-group input.font-lg {
            font-size: 17px;
        }
        .calc-input-group input.font-md {
            font-size: 14px;
        }
        .calc-input-group input.font-sm {
            font-size: 12px;
        }
        .calc-input-group input.font-xs {
            font-size: 10px;
        }
        .calc-input-group input.font-xxs {
            font-size: 9px;
        }

        .calc-input-group input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
            font-size: 15px;
            text-align: right;
        }

        .calc-input-group input:read-only {
            color: #475569;
        }

        /* ============================================ */
        /* BOTÓN COPIAR                                 */
        /* ============================================ */
        .calc-copy {
            background: transparent;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 0 8px 8px 0;
        }

        .calc-copy:hover {
            background: #f1f5f9;
            color: #3b82f6;
        }

        .calc-copy:active {
            transform: scale(0.92);
        }

        .calc-copy.copied {
            color: #22c55e;
        }

        .calc-copy svg {
            display: block;
        }

        /* ============================================ */
        /* BOTONES DE ACCIÓN                           */
        /* ============================================ */
        .calc-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        @media (max-width: 479px) {
            .calculator-container {
                padding: 18px 14px 18px;
                border-radius: 16px;
            }
            .calc-actions {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .calc-input-group input {
                font-size: 16px;
                padding: 8px 6px;
            }
            .calc-result {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                font-size: 12px;
                padding: 12px 14px;
            }
            .calc-header .badge {
                font-size: 8px;
                padding: 2px 8px;
            }
            .calc-subtitle {
                padding-left: 0;
                font-size: 12px;
            }
            .history-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }

        @media (max-width: 380px) {
            .calc-grid {
                gap: 8px;
            }
            .calc-input-group input {
                font-size: 14px;
                padding: 6px 4px;
            }
            .calc-copy {
                padding: 4px 8px;
            }
            .calc-btn {
                font-size: 10px;
                padding: 6px 4px;
            }
        }

        .calc-btn {
            padding: 9px 6px;
            border: none;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: inherit;
        }

        .calc-btn svg {
            flex-shrink: 0;
        }

        .calc-btn:active {
            transform: scale(0.96);
        }

        .calc-btn-clear {
            background: #f1f5f9;
            color: #475569;
        }

        .calc-btn-clear:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .calc-btn-auto {
            background: #dbeafe;
            color: #2563eb;
        }

        .calc-btn-auto:hover {
            background: #bfdbfe;
            color: #1d4ed8;
        }

        .calc-btn-copy-all {
            background: #0f172a;
            color: white;
        }

        .calc-btn-copy-all:hover:not(:disabled) {
            background: #1e293b;
        }

        .calc-btn-copy-all:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .calc-btn-history {
            background: #fef3c7;
            color: #d97706;
        }

        .calc-btn-history:hover {
            background: #fde68a;
            color: #b45309;
        }

        .calc-btn-history.active {
            background: #d97706;
            color: white;
        }

        /* ============================================ */
        /* RESULTADO ACTUAL                            */
        /* ============================================ */
        .calc-result {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            min-height: 52px;
            transition: background 0.2s, border-color 0.2s;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .calc-result.has-data {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .calc-result-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .calc-result-row .label {
            font-weight: 600;
            color: #475569;
            font-size: 11px;
            flex-shrink: 0;
        }

        .calc-result-row .label-main {
            font-weight: 700;
            color: #0f172a;
            font-size: 12px;
            flex-shrink: 0;
        }

        .calc-result-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-weight: 500;
            font-size: 13px;
            color: #0f172a;
            background: #ffffff;
            padding: 2px 10px 2px 8px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .calc-result-item .label-sm {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .calc-result-item .value {
            font-weight: 700;
            font-size: 13px;
        }

        .calc-result-item .value.subtotal-value {
            color: #2563eb;
        }

        .calc-result-item .value.igv-value {
            color: #7c3aed;
        }

        .calc-result-item .value.total-value {
            color: #0f172a;
            font-size: 14px;
        }

        .calc-result-item.total-item {
            background: #dbeafe;
            border-color: #93c5fd;
            padding: 2px 12px 2px 10px;
        }

        .calc-result-item.total-item .value.total-value {
            font-size: 15px;
        }

        .calc-result-divider {
            color: #cbd5e1;
            font-size: 12px;
            user-select: none;
        }

        /* ============================================ */
        /* HISTORIAL                                    */
        /* ============================================ */
        .history-container {
            border-top: 2px solid #f1f5f9;
            padding-top: 12px;
            margin-top: 4px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }

        .history-container.open {
            max-height: 400px;
            opacity: 1;
            padding-top: 12px;
            overflow-y: auto;
        }

        .history-container::-webkit-scrollbar {
            width: 4px;
        }

        .history-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .history-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .history-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }

        .history-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-title .count {
            background: #e2e8f0;
            color: #475569;
            font-size: 10px;
            padding: 0 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .history-actions {
            display: flex;
            gap: 6px;
        }

        .history-btn-clear {
            background: #fef2f2;
            color: #ef4444;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-btn-clear:hover {
            background: #fee2e2;
        }

        .history-btn-clear:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .history-btn-export {
            background: #f0fdf4;
            color: #22c55e;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-btn-export:hover {
            background: #dcfce7;
        }

        .history-btn-export:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Items del historial */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 3px solid #e2e8f0;
            transition: all 0.2s;
            gap: 10px;
            flex-wrap: wrap;
        }

        .history-item:hover {
            background: #f1f5f9;
            transform: translateX(2px);
        }

        .history-item .h-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }

        .history-item .h-time {
            font-size: 10px;
            color: #94a3b8;
            font-family: ui-monospace, monospace;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .history-item .h-values {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-item .h-value {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            background: white;
        }

        .history-item .h-value.subtotal {
            color: #2563eb;
        }

        .history-item .h-value.igv {
            color: #7c3aed;
        }

        .history-item .h-value.total {
            color: #0f172a;
            background: #dbeafe;
            font-weight: 700;
        }

        .history-item .h-index {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 600;
            flex-shrink: 0;
            min-width: 20px;
        }

        .history-empty {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            padding: 20px 0;
        }

        .history-empty .emoji {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        /* ============================================ */
        /* TOAST                                       */
        /* ============================================ */
        .calc-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0f172a;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(80px) scale(0.95);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
        }

        .calc-toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .calc-toast.success {
            border-left: 4px solid #22c55e;
        }

        .calc-toast.error {
            border-left: 4px solid #ef4444;
        }

        .calc-toast .toast-icon {
            font-size: 18px;
        }

        /* ============================================ */
        /* ANIMACIONES                                 */
        /* ============================================ */
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .calc-field.calc-total .calc-input-group:focus-within {
            animation: pulse 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .calc-result.has-data {
            animation: fadeIn 0.3s ease;
        }

        .history-item {
            animation: fadeIn 0.3s ease;
        }

        .calc-result-item {
            transition: all 0.2s ease;
        }

        .calc-result-item:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .history-item .h-badge-new {
            background: #22c55e;
            color: white;
            font-size: 7px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 1s ease infinite;
            flex-shrink: 0;
        }

        /* ============================================ */
        /* ESTILO PARA EL CAMPO TOTAL (foco inicial)   */
        /* ============================================ */
        .calc-field.calc-total .calc-input-group.input-focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        @media (max-width: 480px) {
            .calc-result {
                padding: 12px 14px;
                gap: 6px;
            }

            .calc-result-item {
                font-size: 11px;
                padding: 2px 8px 2px 6px;
            }

            .calc-result-item .value {
                font-size: 11px;
            }

            .calc-result-item.total-item .value.total-value {
                font-size: 13px;
            }

            .calc-result-row {
                gap: 4px 6px;
            }

            .calc-result-row .label-main {
                font-size: 11px;
            }

            .history-item {
                padding: 6px 10px;
                font-size: 11px;
            }

            .history-item .h-value {
                font-size: 10px;
            }

            .history-item .h-time {
                font-size: 9px;
            }
        }

        @media (max-width: 380px) {
            .calc-result-item {
                font-size: 10px;
                padding: 1px 6px 1px 4px;
            }

            .calc-result-item .value {
                font-size: 10px;
            }

            .calc-result-item.total-item .value.total-value {
                font-size: 12px;
            }

            .calc-result-divider {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <!-- HEADER -->
        <div class="calc-header">
            <span class="icon">🧮</span>
            <h1>Calculadora Financiera</h1>
            <span class="badge">IGV 18%</span>
            <span class="badge-pro">⚡ PRO</span>
        </div>
        <p class="calc-subtitle">Calcula Subtotal, IGV (18%) y Total con historial de operaciones</p>

        <!-- CAMPOS -->
        <div class="calc-grid">
            <div class="calc-field">
                <label>Subtotal <span class="label-badge">Base</span></label>
                <div class="calc-input-group">
                    <span class="currency">S/</span>
                    <input type="text" id="calcSubtotal" inputmode="decimal" placeholder="0.00" autocomplete="off" />
                    <button class="calc-copy" data-target="calcSubtotal" title="Copiar Subtotal">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="calc-field">
                <label>IGV (18%) <span class="label-badge">Impuesto</span></label>
                <div class="calc-input-group">
                    <span class="currency">S/</span>
                    <input type="text" id="calcIgv" inputmode="decimal" placeholder="0.00" readonly autocomplete="off" />
                    <button class="calc-copy" data-target="calcIgv" title="Copiar IGV">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="calc-field calc-total">
                <label>Total <span class="label-badge">Pagar</span></label>
                <div class="calc-input-group" id="totalInputGroup">
                    <span class="currency">S/</span>
                    <input type="text" id="calcTotal" inputmode="decimal" placeholder="0.00" autocomplete="off" />
                    <button class="calc-copy" data-target="calcTotal" title="Copiar Total">
