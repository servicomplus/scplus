<!-- ===== HEADER PREMIUM ===== -->
<header id="mainHeader" 
        class="sticky top-0 z-50 border-b transition-all duration-500"
        style="background: rgba(255,255,255,0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom-color: rgba(232,234,237,0.2);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        
        <!-- ===== LOGO ===== -->
        <a href="/" class="flex items-center gap-4 hover:opacity-80 transition-opacity flex-shrink-0">
            <img 
                src="img/logo.png" 
                alt="ServiComp+" 
                class="h-14 w-auto object-contain"
                loading="lazy"
                decoding="async"
                width="200"
                height="140"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
            >
            <div class="hidden items-center justify-center w-12 h-12 bg-navy rounded-xl text-white font-extrabold text-lg flex-shrink-0 shadow-md shadow-navy/20">
                SC
            </div>
        </a>
        
        <!-- ===== NAVEGACIÓN ===== -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-text">
            <a href="/" class="hover:text-navy transition-colors relative group">
                Inicio
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
            <a href="/servicios.html" class="hover:text-navy transition-colors relative group">
                Servicios
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
            <a href="/tienda.html" class="hover:text-navy transition-colors relative group">
                Tienda
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
            <a href="/software.html" class="hover:text-navy transition-colors relative group">
                Software
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
            <a href="/asesor.html" class="hover:text-navy transition-colors relative group">
                Asesoría
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
            <a href="/cotizacion.html" class="hover:text-navy transition-colors relative group">
                Cotización
                <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-navy to-navy-light transition-all group-hover:w-full"></span>
            </a>
        </nav>

        <!-- ===== ACCIONES ===== -->
        <div class="flex items-center gap-3">
            
            <!-- ===== MODO OSCURO PREMIUM ===== -->
            <button id="darkToggle" class="relative w-12 h-6 rounded-full transition-all duration-500 focus:outline-none group" aria-label="Cambiar modo oscuro" style="background: #e8eaed;">
                <!-- Fondo con gradiente cuando está activo -->
                <span class="absolute inset-0 rounded-full transition-all duration-500" style="background: linear-gradient(135deg, #1a3a5c, #2c5282); opacity: 0;"></span>
                
                <!-- Círculo deslizante -->
                <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow-lg transition-all duration-500 flex items-center justify-center group-hover:scale-105" style="box-shadow: 0 2px 8px rgba(0,0,0,0.12);">
                    <!-- Icono Sol -->
                    <svg class="w-3 h-3 text-amber-500 transition-all duration-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
                    </svg>
                    <!-- Icono Luna -->
                    <svg class="w-3 h-3 text-slate-300 absolute opacity-0 transition-all duration-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                </span>
            </button>
            
            <!-- ===== BOTÓN SOPORTE (SIN TEXTO) ===== -->
            <a href="/contacto.html" 
               class="inline-flex items-center justify-center w-10 h-10 bg-navy hover:bg-navy-light text-white rounded-full transition-all duration-300 shadow-lg shadow-navy/20 btn-shine hover:scale-105">
                <i class="fa-regular fa-message text-sm"></i>
            </a>
            
            <!-- ===== MENÚ MÓVIL ===== -->
            <button id="mobileMenuBtn" class="md:hidden text-navy text-2xl hover:text-navy-light transition-colors" aria-label="Abrir menú">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>
    
    <!-- ===== MENÚ MÓVIL ===== -->
    <div id="mobileMenu" class="hidden md:hidden bg-white/95 backdrop-blur-lg border-t border-gray-border/50 px-4 py-4 shadow-2xl">
        <nav class="flex flex-col gap-3 text-sm font-medium text-gray-text">
            <a href="/" class="hover:text-navy transition-colors py-2 border-b border-gray-border/30">Inicio</a>
            <a href="/servicios.html" class="hover:text-navy transition-colors py-2 border-b border-gray-border/30">Servicios</a>
            <a href="/tienda.html" class="hover:text-navy transition-colors py-2 border-b border-gray-border/30">Tienda</a>
            <a href="/software.html" class="hover:text-navy transition-colors py-2 border-b border-gray-border/30">Software</a>
            <a href="/asesor.html" class="hover:text-navy transition-colors py-2 border-b border-gray-border/30">Asesoría</a>
            <a href="/cotizacion.html" class="hover:text-navy transition-colors py-2">Cotización</a>
        </nav>
    </div>
</header>
